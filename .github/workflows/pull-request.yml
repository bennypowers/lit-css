name: Verify PR

on:
  pull_request:
    branches:
      - main

jobs:
  verify:
    # Prevents changesets action from creating a PR on forks
    if: github.repository == 'bennypowers/lit-css'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Release installs npm@latest before testing and publishing, so test with
      # the same npm here to catch version drift before it reaches main.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install packages
        run: npm ci --prefer-offline

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  integration:
    # Builds the vite integration fixture against supported vite majors, so a
    # new major fails here instead of in consumers.
    if: github.repository == 'bennypowers/lit-css'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with the vite peer range in packages/vite-plugin-lit-css.
        vite: [7, 8]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install packages
        run: npm ci --prefer-offline

      - name: Build plugin
        run: npm run build:runtime

      - name: Install fixture packages
        working-directory: packages/vite-plugin-lit-css/integration-test
        run: npm ci --prefer-offline

      - name: Pin vite ${{ matrix.vite }}
        working-directory: packages/vite-plugin-lit-css/integration-test
        run: npm install --no-save --no-package-lock vite@${{ matrix.vite }}

      - name: Build fixture
        working-directory: packages/vite-plugin-lit-css/integration-test
        run: npm run build

name: Verify PR

on:
  pull_request:
    branches:
      - main

jobs:
  verify:
    # Prevents changesets action from creating a PR on forks
    if: github.repository == 'bennypowers/lit-css'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Release installs npm@latest before testing and publishing, so test with
      # the same npm here to catch version drift before it reaches main.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install packages
        run: npm ci --prefer-offline

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

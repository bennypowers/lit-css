name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    # Prevents changesets action from creating a PR on forks
    if: github.repository == 'bennypowers/lit-css'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer, which is not guaranteed
      # to be the version bundled with the runner's Node.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install packages
        run: npm ci --prefer-offline

      - name: Test
        run: npm test

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v2
        with:
          # npm attaches provenance automatically when publishing through a
          # trusted publisher. `changeset publish` does not accept --provenance.
          publish-script: npx changeset publish
          github-token: ${{ secrets.GITHUB_TOKEN }}
